name: Develop focused corpus

on:
  workflow_dispatch:
    inputs:
      year:
        description: Publication year to backfill (one year shard per run)
        required: true
        default: '2026'
      max_pages:
        description: Maximum OpenAlex cursor pages
        required: true
        default: '200'
      budget:
        description: Maximum recorded spend in this shard today (USD)
        required: true
        default: '0.25'

permissions:
  contents: write

concurrency:
  group: focused-corpus-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate candidate and inputs
        env:
          YEAR: ${{ inputs.year }}
          MAX_PAGES: ${{ inputs.max_pages }}
          BUDGET: ${{ inputs.budget }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          test -n "$OPENALEX_API_KEY"
          python -m src.corpus.focused plan >/dev/null
          python - "$YEAR" "$MAX_PAGES" "$BUDGET" <<'PY'
          import sys
          from datetime import datetime, timezone
          year, pages, budget = int(sys.argv[1]), int(sys.argv[2]), float(sys.argv[3])
          if not 2017 <= year <= datetime.now(timezone.utc).year or not 1 <= pages <= 250 or not 0 < budget <= 0.25:
              raise SystemExit('Year, pages or budget exceeds the safe manual backfill bounds')
          PY
      - name: Restore year checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ inputs.year }}
        run: |
          mkdir -p .cache/corpus
          gh release view focused-corpus-v1-checkpoint >/dev/null
          if gh release view focused-corpus-v1-checkpoint --json assets --jq '.assets[].name' | grep -Fxq "focused-${YEAR}.sqlite.gz"; then
            gh release download focused-corpus-v1-checkpoint --pattern "focused-${YEAR}.sqlite.gz" --dir .cache/corpus
            python -m src.corpus.checkpoint restore --db ".cache/corpus/focused-${YEAR}.sqlite" --archive ".cache/corpus/focused-${YEAR}.sqlite.gz"
          fi
      - name: Collect bounded pages
        id: collect
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          YEAR: ${{ inputs.year }}
          MAX_PAGES: ${{ inputs.max_pages }}
          BUDGET: ${{ inputs.budget }}
        run: python -m src.corpus.collect --focused --year "$YEAR" --max-pages "$MAX_PAGES" --budget "$BUDGET"
      - name: Preserve checkpoint after any collection outcome
        if: always() && steps.collect.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          YEAR: ${{ inputs.year }}
        run: |
          if [ -f ".cache/corpus/focused-${YEAR}.sqlite" ]; then
            python -m src.corpus.checkpoint save --db ".cache/corpus/focused-${YEAR}.sqlite" --archive ".cache/corpus/focused-${YEAR}.sqlite.gz"
            gh release upload focused-corpus-v1-checkpoint ".cache/corpus/focused-${YEAR}.sqlite.gz" --clobber
            python -m src.corpus.focused status --db ".cache/corpus/focused-${YEAR}.sqlite"
          fi
