name: Deploy Research Atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Preserve latest published data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/research-atlas-data
          if git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/research-atlas-pages; then
            if [ -d /tmp/research-atlas-pages/data ]; then
              cp -R /tmp/research-atlas-pages/data/. /tmp/research-atlas-data/
            fi
          fi

      - name: Build static site
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Restore latest published data
        run: |
          if [ -n "$(find /tmp/research-atlas-data -mindepth 1 -print -quit)" ]; then
            rm -rf frontend/dist/data
            mkdir -p frontend/dist/data
            cp -R /tmp/research-atlas-data/. frontend/dist/data/
          fi

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch frontend/dist/.nojekyll
          cd frontend/dist
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
