name: Refresh OpenAlex Data

on:
  workflow_dispatch:
    inputs:
      max_works:
        description: Max works per topic
        required: false
        default: "600"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh static artifact
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/refresh_data.py --max-works "${{ inputs.max_works }}"

      - name: Commit refreshed artifact
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh OpenAlex static data
          file_pattern: data/processed/atlas.json
