name: Refresh OpenAlex Data

on:
  schedule:
    - cron: "17 07 * * 1"
  workflow_dispatch:
    inputs:
      max_works:
        description: Max works per topic
        required: false
        default: "1000"

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify OpenAlex credentials
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: test -n "$OPENALEX_API_KEY" || (echo "OPENALEX_API_KEY is not configured" && exit 1)

      - name: Refresh and validate data
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MAX_WORKS: ${{ inputs.max_works || '1000' }}
        run: >-
          ./src/refresh_data.sh
          --max-works "$MAX_WORKS"
          --min-interval 0.5
          --max-attempts 2
          --max-retry-wait 15
          --require-complete-config

      - name: Build static site
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Publish gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch frontend/dist/.nojekyll
          cd frontend/dist
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh OpenAlex data ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
