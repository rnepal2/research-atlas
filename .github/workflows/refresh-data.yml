name: Refresh OpenAlex Data

on:
  workflow_dispatch:
    inputs:
      max_works:
        description: Max works per topic
        required: false
        default: "3000"
      stale_below:
        description: Refresh topics with fewer raw works than this
        required: false
        default: "2604"
      limit_topics:
        description: Optional number of shallowest topics to refresh; use 0 for all
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh static artifact
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: >
          ./src/refresh_data.sh
          --max-works "${{ inputs.max_works }}"
          --stale-below "${{ inputs.stale_below }}"
          --sort-by-raw-depth
          --limit-topics "${{ inputs.limit_topics }}"

      - name: Commit refreshed artifact
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Refresh OpenAlex static data
          file_pattern: |
            data/processed/atlas.json
            data/processed/atlas-index.json
            data/processed/progress_metrics.json
            data/processed/topics/*.json
            frontend/public/route-metadata.json
            frontend/public/sitemap.xml
